<p>
  To set up the Macaulay2 repository and install Macaulay2, paste the
  following into a terminal:
</p>
<pre>
/bin/bash -c "$(curl -fsSL https://macaulay2.com/Repositories/install-rpm.sh)"
</pre>
<p>
  Alternatively, see the <a href="https://github.com/Macaulay2/M2/wiki/Installing-Macaulay2-in-Linux#red-hat-enterprise-linux">wiki</a> for instructions on installing Macaulay2 in Red Hat Enterprise Linux.
</p>
